<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PaceLab{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('inicio') }}" aria-label="PaceLab — início">
      <span class="brand-mark">P</span>
      <span><strong>PaceLab</strong><small>Previsão por percurso</small></span>
    </a>
    <nav class="tabs" aria-label="Navegação principal">
      <a class="{{ 'active' if pagina == 'previsao' else '' }}" href="{{ url_for('inicio') }}">Previsão</a>
      <a class="{{ 'active' if pagina == 'graficos' else '' }}" href="{{ url_for('graficos') }}">Gráficos de treino</a>
    </nav>
    <div class="model-pill" title="Modelo carregado">
      <span class="status-dot"></span>{{ modelo.nome }} · {{ modelo.atividades }} atividades
    </div>
  </header>

  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>

  <footer>
    PaceLab · Modelo com {{ "{:,}".format(modelo.amostras).replace(',', ' ') }} amostras · MAE {{ "%.1f"|format(modelo.mae) }} s/km
  </footer>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
